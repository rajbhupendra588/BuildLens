name: buildlens

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildlens-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-buildlens_db}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildlens-net

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: buildlens-vector-db
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API (Faster for large data)
    volumes:
      - ./qdrant_data:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep 18BD"]
      # test: ["CMD-SHELL", "ls /qdrant/storage || exit 1"]
      # test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - buildlens-net

  backend:
    build: ./backend
    container_name: buildlens-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - backend_model_cache:/app/.cache
      - ./uploads_data:/app/uploads_data
    # No --reload: hot reload kills in-flight PDF ingest (OCR can run 10+ minutes).
    command: sh -c "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    mem_limit: 4g
    cpus: 2.0
    environment:
      - PYTHONPATH=/app
      - OMP_NUM_THREADS=1
      - ORT_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - MALLOC_ARENA_MAX=2
      - PYTHONDONTWRITEBYTECODE=1
      - FASTEMBED_CACHE_DIR=/app/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - buildlens-net

  frontend:
    build: ./frontend
    container_name: buildlens-ui
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    networks:
      - buildlens-net

volumes:
  backend_venv:
  backend_model_cache:
  frontend_node_modules:
  postgres_data:

networks:
  buildlens-net:
    driver: bridge
